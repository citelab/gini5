# A-Lab 02 — fair share: tickets, an honest lottery, and stride scheduling.
# The student handout (ALab02_Scheduling_Student.docx) lives with the course materials; `where`
# and the part titles are its words. The build plan it was implemented from is
# kept privately; what was built, the measured numbers behind every tolerance below, and
# the test report are kept privately with the solutions (GINI_ALAB02_SOLUTIONS).
#
# Why the id is still `a-lab-02` and not a topic slug like A-Lab 01's: it is the student's folder
# name (~/.gini/xv6-lab/<machine>/a-lab-02/), and the placeholder that shipped before this lab
# already created that folder on machines that armed nothing.
id: a-lab-02
title: "A-Lab 02 — fair share"
summary: "Give processes tickets, then make lottery and stride scheduling honour them."

parts:
  A: "A word for how much"
  B: "Make the draw honest"
  C: "The same promise, without luck"
syscall_number: 23          # stock xv6 ends at SYS_sync = 22; GINI's own calls start at 64

# Ten files, in the order the handout sends the student to them. Nine are the image's own copies
# (no seed): proc.c and proc.h come back in Part C, and User Code says so.
files:
  - name: syscall.h
    tree: kernel/syscall.h
    part: A
  - name: syscall.c
    tree: kernel/syscall.c
    part: A
  - name: sysproc.c
    tree: kernel/sysproc.c
    part: A
    also: C
  - name: user.h
    tree: user/user.h
    part: A
  - name: usys.pl
    tree: user/usys.pl
    part: A
  - name: proc.c
    tree: kernel/proc.c
    part: A
    also: C
  # The policies, and nothing else: round-robin and priority working, lottery drawing by process
  # count, stride a stub that runs round-robin. Generated by gini_patch.py, so it is in the image.
  - name: sched_policy.c
    tree: kernel/sched_policy.c
    part: B
    also: C
  - name: proc.h
    tree: kernel/proc.h
    part: C
  - name: defs.h
    tree: kernel/defs.h
    part: C

  # The measuring instrument. Seeded complete and never edited: GINI parses what it prints, and
  # it must run on a kernel with no settickets yet (Part A runs it before the call exists), which
  # is why it declares settickets weak instead of including it from user.h.
  - name: sharetest.c
    tree: user/sharetest.c
    uprog: sharetest
    seed: |
      // sharetest -- the measuring instrument for A-Lab 02. Do not edit: GINI reads what it prints.
      //
      //   sharetest [-s] t1 t2 t3
      //
      // Forks three children holding t1, t2 and t3 tickets, lets them spin for 30 seconds, and prints
      // each one's share of the CPU at 5, 15 and 30 seconds, then one report. With -s the FIRST child
      // sleeps for 5 seconds before it starts working, and the report adds everyone's share over the
      // 2 seconds after it wakes.
      //
      // Each child also forks one idle grandchild that only waits. Its tickets -- the tk column in the
      // Process Scheduler face -- show whether fork passed them on.
      //
      // Waiting is done on pipes, never with pause(): pause() wakes on every tick to check the clock,
      // so a pausing process is really scheduled twenty times a second -- under stride it would pay a
      // stride each time, and "asleep for five seconds" would not be asleep at all. A read on an empty
      // pipe sleeps until something is written, which is what -s needs. The parent, which does use
      // pause() to keep time, holds 1024 tickets so that it gets to run when it wakes, whatever the
      // policy under test does with everyone else.
      //
      // While it measures, sharetest shortens the timer tick from ~0.5 s to 50 ms, so 30 seconds is
      // 600 scheduling decisions instead of 60, and it puts the old tick back at the end.

      #include "kernel/types.h"
      #include "user/user.h"
      #include "user/gini.h"

      int settickets(int) __attribute__((weak));   // missing until Part A wires it in

      #define TICK_MS  50
      #define TPS      (1000 / TICK_MS)            // ticks per second while measuring
      #define WINDOW   30                          // seconds
      #define SLEEP_S  5                           // -s: the first child sleeps this long
      #define AFTER_S  2                           // -s: the window after it wakes

      static int tk[3], pid[3], gate[2];

      static void
      spin(void)
      {
        volatile uint x = 0;
        for(;;)
          x++;
      }

      // A grandchild only waits, so its tickets can be read off the Process Scheduler face. It reads
      // a pipe whose other end only its parent holds: when the parent is killed the read returns 0.
      static void
      child(int i, int sleeper)
      {
        int life[2];
        char c;

        if(settickets && settickets(tk[i]) < 0)
          printf("sharetest: settickets(%d) returned -1\n", tk[i]);
        pipe(life);
        if(fork() == 0){
          close(life[1]);
          close(gate[1]);
          read(life[0], &c, 1);
          exit(0);
        }
        close(life[0]);
        close(gate[1]);
        if(sleeper)
          read(gate[0], &c, 1);             // asleep until the parent writes, at SLEEP_S seconds
        spin();
      }

      static void
      shares(char *label, uint64 *from, uint64 *to)
      {
        uint64 d[3], sum = 0;
        for(int i = 0; i < 3; i++){
          d[i] = to[i] - from[i];
          sum += d[i];
        }
        printf("%s", label);
        for(int i = 0; i < 3; i++)
          printf(" %d", sum ? (int)(d[i] * 100 / sum) : 0);
        printf("\n");
      }

      static void
      sample(uint64 *rt)
      {
        for(int i = 0; i < 3; i++){
          int r = getrtime(pid[i]);
          rt[i] = r < 0 ? 0 : r;
        }
      }

      static int
      number(char *s)
      {
        if(*s == 0)
          return -1;
        for(char *c = s; *c; c++)
          if(*c < '0' || *c > '9')
            return -1;
        return atoi(s);
      }

      int
      main(int argc, char *argv[])
      {
        int sflag = argc > 1 && strcmp(argv[1], "-s") == 0;
        int a = sflag ? 2 : 1;
        if(argc - a != 3){
          fprintf(2, "usage: sharetest [-s] t1 t2 t3\n");
          exit(1);
        }
        for(int i = 0; i < 3; i++)
          if((tk[i] = number(argv[a + i])) < 0){
            fprintf(2, "sharetest: %s is not a number of tickets\n", argv[a + i]);
            exit(1);
          }

        if(!settickets)
          printf("sharetest: this kernel has no settickets yet -- every child keeps 1 ticket\n");

        if(settickets)
          settickets(1024);                 // the parent must get to run when it wakes to sample
        pipe(gate);
        int oldtick = settick(TICK_MS);
        for(int i = 0; i < 3; i++){
          if((pid[i] = fork()) < 0){
            fprintf(2, "sharetest: fork failed\n");
            exit(1);
          }
          if(pid[i] == 0)
            child(i, sflag && i == 0);
        }

        uint64 rt0[3], rtw[3], rta[3], rt[3];
        int marks[] = { 5, 15, WINDOW }, m = 0, woke = 0, after = 0;
        sample(rt0);
        int start = uptime();
        while(m < 3){
          pause(1);
          int el = uptime() - start;
          if(sflag && !woke && el >= SLEEP_S * TPS){ write(gate[1], "w", 1); sample(rtw); woke = 1; }
          if(sflag && woke && !after && el >= (SLEEP_S + AFTER_S) * TPS){ sample(rta); after = 1; }
          if(el >= marks[m] * TPS){
            char label[16];
            sample(rt);
            label[0] = 0;
            if(marks[m] == 5) strcpy(label, "share  5s:");
            if(marks[m] == 15) strcpy(label, "share 15s:");
            if(marks[m] == WINDOW) strcpy(label, "share 30s:");
            shares(label, rt0, rt);
            m++;
          }
        }

        for(int i = 0; i < 3; i++)
          kill(pid[i]);
        for(int i = 0; i < 3; i++)
          wait(0);
        settick(oldtick);

        printf("tickets:  %d %d %d\n", tk[0], tk[1], tk[2]);
        printf("rtime:    %d %d %d\n", (int)(rt[0] - rt0[0]), (int)(rt[1] - rt0[1]),
               (int)(rt[2] - rt0[2]));
        shares("share:   ", rt0, rt);
        if(sflag)
          shares("woke 2s: ", rtw, rta);
        printf("window:   %d\n", WINDOW);
        printf("policy:   %d\n", setpolicy(-1));
        exit(0);
      }

test_program: "sharetest 10 5 1"
test_timeout: 45            # sharetest measures for 30 s, then reports

checks:
  # ---- Part A -----------------------------------------------------------------------------
  - id: number
    part: A
    label: "Give the call a number"
    where: kernel/syscall.h
    file: syscall.h
    match: '#define\s+SYS_settickets\s+\d+'
    hint: "The call needs a number, and the name has to be settickets — that is what your program
      will call. The last one here is SYS_sync 22."

  - id: extern
    part: A
    label: "Declare the kernel function"
    where: kernel/syscall.c
    file: syscall.c
    match: 'extern\s+uint64\s+sys_settickets\s*\('
    hint: "syscall.c has to be told sys_settickets exists before the table can name it."

  - id: dispatch
    part: A
    label: "Add a row to syscalls[]"
    where: kernel/syscall.c
    file: syscall.c
    match: '\[\s*SYS_settickets\s*\]'
    hint: "Without the row it builds, then fails at runtime with 'unknown sys call 23'."

  - id: impl
    part: A
    label: "Write the kernel side"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'uint64\s+sys_settickets\s*\(\s*void\s*\)\s*\{'
    hint: "The function the table points at. Until it exists the link fails with undefined
      reference to 'sys_settickets'."

  - id: range
    part: A
    label: "Reject what you cannot honour"
    where: kernel/sysproc.c
    file: sysproc.c
    match: '\b1024\b'
    hint: "Out of range has to return -1 and change nothing — and Part C divides by this number."

  - id: lock
    part: A
    label: "Store it under the process's lock"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'acquire\s*\(\s*&[^)]*->lock\s*\)'
    hint: "Another CPU may be reading this process's tickets in the scheduler right now."

  - id: prototype
    part: A
    label: "Give your program a prototype"
    where: user/user.h
    file: user.h
    match: 'int\s+settickets\s*\(\s*int[^)]*\)\s*;'
    hint: "Without it a program that calls settickets fails with an implicit declaration."

  - id: usys
    part: A
    label: "Add the user stub"
    where: user/usys.pl
    file: usys.pl
    match: 'entry\(\s*"settickets"\s*\)'
    hint: "Until the stub exists the link fails with undefined reference to 'settickets'."

  - id: inherit
    part: A
    label: "A child keeps its parent's tickets"
    where: kernel/proc.c — kfork()
    file: proc.c
    match: 'np->tickets\s*='
    hint: "kfork copies the size, the trapframe, the files and the name. Read what it copies, and
      what it does not."

  # ---- Part B -----------------------------------------------------------------------------
  # The shipped pick_lottery already draws a random number and walks the table, so a check for
  # either would be green before the student starts. This keys on the one thing the uniform draw
  # cannot contain -- a sum over tickets -- and the measured share_lottery carries the real weight.
  - id: weighted
    part: B
    label: "Weight the draw by tickets"
    where: kernel/sched_policy.c — pick_lottery
    file: sched_policy.c
    match: '\+=\s*[^;]*->\s*tickets'
    hint: "The draw is as big as the number of runnable processes. A lottery is fair when it is
      as big as something else."

  # ---- Part C -----------------------------------------------------------------------------
  - id: pass_field
    part: C
    label: "Somewhere to keep a pass"
    where: kernel/proc.h
    file: proc.h
    match: '\b(uint64|unsigned\s+long|long)\s+pass\s*;'
    hint: "The pass grows on every pick, forever — give it room. A 32-bit counter wraps within the
      hour, and a wrapped pass looks like a process infinitely far behind."

  - id: stride_field
    part: C
    label: "Somewhere to keep a stride"
    where: kernel/proc.h
    file: proc.h
    match: '\bstride\s*;'

  - id: born
    part: C
    label: "Set them when a process is born"
    where: kernel/proc.c — allocproc()
    file: proc.c
    match: '\bp->stride\s*='
    hint: "allocproc already gives priority and tickets their defaults. Stride comes from tickets."

  - id: recompute
    part: C
    label: "Keep the stride true when tickets change"
    where: kernel/sysproc.c
    file: sysproc.c
    match: '->\s*stride\s*='
    hint: "When the tickets change, the stride is wrong until you recompute it. Leave the pass
      alone."

  - id: stride_pick
    part: C
    label: "Write the picker"
    where: kernel/sched_policy.c — pick_stride
    file: sched_policy.c
    match: '->\s*pass\s*\+='
    hint: "Smallest pass among the RUNNABLE wins, and the winner moves on by its stride."

  - id: helper
    part: C
    label: "A helper for the smallest pass"
    where: kernel/sched_policy.c
    file: sched_policy.c
    match: 'uint64\s+\w+\s*\(\s*void\s*\)\s*\{'
    hint: "Write it where the policy lives, and declare it in defs.h so proc.c can call it — the
      path freemem took in A-Lab 01."

  - id: join_wakeup
    part: C
    label: "A waking process joins the others"
    where: kernel/proc.c — wakeup()
    file: proc.c
    match: '(?s)wakeup\s*\([^)]*\)\s*\{(?:(?!\n\}).)*->\s*pass\s*='
    hint: "A process that slept still has the pass it went to sleep with."

  - id: join_fork
    part: C
    label: "A new process joins the others"
    where: kernel/proc.c — kfork()
    file: proc.c
    match: '(?s)\bk?fork\s*\(\s*void\s*\)\s*\{(?:(?!\n\}).)*np->\s*pass\s*='
    hint: "The other place a process becomes runnable from outside the scheduler."

# What the grading run does. Each run switches policy with GINI's `policy` command, runs
# sharetest in the foreground, and reads GINI's process table while the children are still alive.
runs:
  lottery:
    policy: 2
    command: "sharetest 10 5 1"
  stride:
    policy: 3
    command: "sharetest 10 5 1"
  sleeper:
    policy: 3
    command: "sharetest -s 10 5 1"

# Tolerances are calibrated from gold runs on one hart (the private A-Lab 02 report, "Calibration"):
#   lottery, 30 s:  worst share off by 1.2-4.6 points over 12 runs (mean 2.3)  -> tolerance 8
#   stride,  30 s:  0.5 points off in every run (it is deterministic)          -> tolerance 3
#   sharetest -s:   the waker takes 62% after waking in every gold run, and 100% with the join
#                   left out (wrong-2); its tickets are worth 62.5%            -> 1.25x = 78%
grade:
  - id: tickets_set
    part: A
    describe: "the tickets sharetest asked for are the ones the kernel holds"
    metric: tickets_visible
    run: stride

  - id: tickets_inherited
    part: A
    describe: "a forked child holds its parent's tickets"
    metric: tickets_inherited
    run: stride

  - id: share_lottery
    part: B
    describe: "under lottery, each child's CPU share follows its tickets over 30 s"
    metric: share_vs_tickets
    run: lottery
    expect: 2
    tolerance: 8

  - id: share_stride
    part: C
    describe: "under stride, each child's CPU share follows its tickets over 30 s"
    metric: share_vs_tickets
    run: stride
    expect: 3
    tolerance: 3

  - id: stride_steadier
    part: C
    describe: "stride stays closer to the ticket shares than lottery does, early and late"
    metric: share_variance
    run: "lottery stride"
    tolerance: 6           # points across the three windows that are only rounding (62.5 -> 62)

  - id: join_no_hog
    part: C
    describe: "a process waking from a long sleep takes its share, not the machine"
    metric: wake_share
    run: sleeper
    tolerance: 1.25
